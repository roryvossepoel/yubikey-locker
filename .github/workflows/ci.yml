name: Windows tests and build
on:
  workflow_dispatch:
  pull_request:
  release:
    types: [created]


permissions:
  contents: write # to enable releases

jobs:
  yklocker_build:
    runs-on: windows-2025-vs2026
    # Get access to repo contents
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python # Get Python with the minimum required version
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          echo ${{github.ref}}
          python -m pip install --upgrade pip
          pip install tox


      - name: Install requirements.txt and run tests for Windows
        run: |
          python -m tox

      - name: Build for Windows
        run: |
          python -m tox -e build_win
          ls dist

      - name: "Windows MSI build"
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix.exe build -arch x64 .\src\windows_utils\yubikey-locker.wxs
          cp .\src\windows_utils\yubikey-locker.msi dist/yubikey-locker.msi
          ls dist

      - name: "Windows MSI install"
        run: |
          $msi = (Resolve-Path 'dist/yubikey-locker.msi').Path
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'install.log') -Wait -PassThru
          Get-Content install.log
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSI install failed: $($process.ExitCode)" }

      - name: Include Windows policy templates and documentation
        shell: pwsh
        run: |
          Copy-Item -Recurse 'src/windows_utils/Administrative template (ADMX)/ADMX' 'dist/PolicyDefinitions'
          Copy-Item README.md, LICENSE dist/

      - if: github.event_name != 'release'
        name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: windows-x64
          path: dist/
          retention-days: 7

      # Only publish files on release
      - if: github.event_name ==  'release'
        name: "Publish release files"
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "${{github.ref_name}}"
          prerelease: False
          fail_on_unmatched_files: true
          files: |
            dist/yubikey-locker.msi
            dist/yubikey-locker.exe
            dist/PolicyDefinitions/SciberYklocker.admx
            dist/PolicyDefinitions/en-US/SciberYklocker.adml
            dist/README.md
            dist/LICENSE
